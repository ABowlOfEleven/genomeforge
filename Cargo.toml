[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["GenomeForge contributors"]
repository = "https://github.com/ABowlOfEleven/genomeforge"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

# Faster iterative debug builds for the heavy dependency tree (egui, noodles).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
