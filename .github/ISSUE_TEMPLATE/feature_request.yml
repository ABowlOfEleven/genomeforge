name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Genome browser / variants
        - Plasmid designer
        - CRISPR studio
        - Phenotype & risk
        - Packaging / platforms
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
