# Flatpak manifest for GenomeForge.
#
# Builds the Rust app inside the freedesktop SDK with network access: it
# installs an up-to-date Rust toolchain via rustup (the runtime's rust-stable
# extension lags egui 0.34's 1.92 MSRV) and lets cargo fetch crates from
# crates.io. Simpler than offline vendoring — fine for a self-hosted bundle,
# though not Flathub-compliant (Flathub requires fully offline builds).
#
# File access is portal-mediated (rfd 0.17 uses the XDG desktop portal on
# Linux), so the app needs NO broad --filesystem permission: the user picks a
# file and the portal grants access to just that file.
id: io.github.abowlofeleven.GenomeForge
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: GenomeForge

finish-args:
  # GPU-accelerated rendering (egui/glow) on Wayland or X11.
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Variant/gene annotation, PGS Catalog, and PubMed are fetched over the network.
  - --share=network

modules:
  - name: genomeforge
    buildsystem: simple
    build-options:
      # Build online: install the pinned toolchain via rustup, then let cargo
      # fetch crates from crates.io. (The runtime's rust-stable extension is too
      # old for egui 0.34's 1.92 MSRV.)
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/genomeforge/cargo
        RUSTUP_HOME: /run/build/genomeforge/rustup
    build-commands:
      - "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.96.0"
      - "$CARGO_HOME/bin/cargo build --release --locked --verbose -p gx-app"
      - install -Dm755 target/release/GenomeForge /app/bin/GenomeForge
      - install -Dm644 packaging/linux/io.github.abowlofeleven.GenomeForge.desktop
        /app/share/applications/io.github.abowlofeleven.GenomeForge.desktop
      - install -Dm644 packaging/linux/io.github.abowlofeleven.GenomeForge.metainfo.xml
        /app/share/metainfo/io.github.abowlofeleven.GenomeForge.metainfo.xml
      - install -Dm644 assets/icon.png
        /app/share/icons/hicolor/256x256/apps/io.github.abowlofeleven.GenomeForge.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - target
